<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Border Frame -->
  <rect x="40" y="40" width="1840" height="1000" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  
  <!-- Slide Header -->
  <g transform="translate(80, 100)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#666666" letter-spacing="3" text-anchor="start">LEARNEX DEMO PLATFORM</text>
    <text x="0" y="45" font-size="42" font-weight="800" fill="#000000" letter-spacing="-0.5">DEMO — S001: Factorization</text>
    <line x1="0" y1="70" x2="1760" y2="70" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- 6 Stages Horizontal Flow -->
  <!-- Stage 1 -->
  <g transform="translate(80, 240)">
    <rect x="0" y="0" width="260" height="480" fill="#ffffff" stroke="#000000" stroke-width="2" rx="4"/>
    <rect x="0" y="0" width="260" height="45" fill="#000000"/>
    <text x="16" y="28" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">1. STUDENT INPUT</text>
    
    <text x="20" y="90" font-size="14" font-weight="700" fill="#666666">STUDENT ID</text>
    <text x="20" y="120" font-size="22" font-weight="800" fill="#000000">S001</text>
    
    <line x1="20" y1="150" x2="240" y2="150" stroke="#e0e0e0" stroke-width="1"/>
    
    <text x="20" y="190" font-size="14" font-weight="700" fill="#666666">TOPIC</text>
    <text x="20" y="220" font-size="20" font-weight="700" fill="#000000">Factorization</text>
    
    <line x1="20" y1="250" x2="240" y2="250" stroke="#e0e0e0" stroke-width="1"/>
    
    <text x="20" y="290" font-size="14" font-weight="700" fill="#666666">INITIAL MASTERY</text>
    <rect x="20" y="310" width="220" height="70" fill="#f4f4f4" stroke="#cccccc" stroke-width="1" rx="4"/>
    <text x="35" y="355" font-size="32" font-weight="800" fill="#000000">Pre-Test: 42%</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(345, 470)">
    <path d="M 0 0 L 25 0 M 17 -6 L 25 0 L 17 6" stroke="#000000" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(375, 240)">
    <rect x="0" y="0" width="260" height="480" fill="#ffffff" stroke="#000000" stroke-width="2" rx="4"/>
    <rect x="0" y="0" width="260" height="45" fill="#000000"/>
    <text x="16" y="28" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">2. SYSTEM ANALYSIS</text>

    <g transform="translate(20, 80)">
      <circle cx="10" cy="10" r="4" fill="#000000"/>
      <text x="24" y="15" font-size="15" font-weight="600" fill="#000000">Error pattern</text>
      <text x="24" y="35" font-size="15" font-weight="600" fill="#000000">detected</text>
    </g>

    <line x1="20" y1="170" x2="240" y2="170" stroke="#e0e0e0" stroke-width="1"/>

    <g transform="translate(20, 195)">
      <circle cx="10" cy="10" r="4" fill="#000000"/>
      <text x="24" y="15" font-size="15" font-weight="600" fill="#000000">Potential misconception</text>
      <text x="24" y="35" font-size="15" font-weight="600" fill="#000000">identified</text>
    </g>

    <line x1="20" y1="285" x2="240" y2="285" stroke="#e0e0e0" stroke-width="1"/>

    <g transform="translate(20, 310)">
      <circle cx="10" cy="10" r="4" fill="#000000"/>
      <text x="24" y="15" font-size="15" font-weight="600" fill="#000000">Related concepts</text>
      <text x="24" y="35" font-size="15" font-weight="600" fill="#000000">traced</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(640, 470)">
    <path d="M 0 0 L 25 0 M 17 -6 L 25 0 L 17 6" stroke="#000000" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(670, 240)">
    <rect x="0" y="0" width="260" height="480" fill="#ffffff" stroke="#000000" stroke-width="2" rx="4"/>
    <rect x="0" y="0" width="260" height="45" fill="#000000"/>
    <text x="16" y="28" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">3. AI INTERVENTION</text>

    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="220" height="95" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" rx="4"/>
      <text x="15" y="30" font-size="14" font-weight="700" fill="#000000">Knowledge-grounded</text>
      <text x="15" y="50" font-size="14" font-weight="700" fill="#000000">explanation</text>
    </g>

    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="220" height="80" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" rx="4"/>
      <text x="15" y="45" font-size="14" font-weight="700" fill="#000000">Worked example</text>
    </g>

    <g transform="translate(20, 295)">
      <rect x="0" y="0" width="220" height="80" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" rx="4"/>
      <text x="15" y="45" font-size="14" font-weight="700" fill="#000000">Targeted practice</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(935, 470)">
    <path d="M 0 0 L 25 0 M 17 -6 L 25 0 L 17 6" stroke="#000000" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(965, 240)">
    <rect x="0" y="0" width="260" height="480" fill="#ffffff" stroke="#000000" stroke-width="2" rx="4"/>
    <rect x="0" y="0" width="260" height="45" fill="#000000"/>
    <text x="16" y="28" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">4. TEACHER REVIEW</text>

    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="220" height="50" fill="#f4f4f4" stroke="#000000" stroke-width="1" rx="4"/>
      <text x="110" y="31" font-size="16" font-weight="700" fill="#000000" text-anchor="middle">Review</text>
    </g>
    
    <path d="M 130 180 L 130 200 M 124 194 L 130 200 L 136 194" stroke="#000000" stroke-width="2" fill="none"/>

    <g transform="translate(20, 210)">
      <rect x="0" y="0" width="220" height="50" fill="#f4f4f4" stroke="#000000" stroke-width="1" rx="4"/>
      <text x="110" y="31" font-size="16" font-weight="700" fill="#000000" text-anchor="middle">Edit</text>
    </g>

    <path d="M 130 270 L 130 290 M 124 284 L 130 290 L 136 284" stroke="#000000" stroke-width="2" fill="none"/>

    <g transform="translate(20, 300)">
      <rect x="0" y="0" width="220" height="55" fill="#000000" stroke="#000000" stroke-width="1" rx="4"/>
      <text x="110" y="34" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Approve</text>
    </g>
  </g>

  <!-- Arrow 4 -> 5 -->
  <g transform="translate(1230, 470)">
    <path d="M 0 0 L 25 0 M 17 -6 L 25 0 L 17 6" stroke="#000000" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Stage 5 -->
  <g transform="translate(1260, 240)">
    <rect x="0" y="0" width="260" height="480" fill="#ffffff" stroke="#000000" stroke-width="2" rx="4"/>
    <rect x="0" y="0" width="260" height="45" fill="#000000"/>
    <text x="16" y="28" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">5. ADAPTIVE PRACTICE</text>

    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="220" height="230" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4"/>
      <text x="20" y="50" font-size="16" font-weight="700" fill="#000000">Student completes</text>
      <text x="20" y="75" font-size="16" font-weight="700" fill="#000000">targeted</text>
      <text x="20" y="100" font-size="16" font-weight="700" fill="#000000">exercises</text>
      
      <!-- Progress Bar Mock -->
      <rect x="20" y="150" width="180" height="12" fill="#e0e0e0" rx="6"/>
      <rect x="20" y="150" width="180" height="12" fill="#000000" rx="6"/>
      <text x="20" y="185" font-size="12" font-weight="700" fill="#666666">PROGRESS: 100%</text>
    </g>
  </g>

  <!-- Arrow 5 -> 6 -->
  <g transform="translate(1525, 470)">
    <path d="M 0 0 L 25 0 M 17 -6 L 25 0 L 17 6" stroke="#000000" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Stage 6 -->
  <g transform="translate(1555, 240)">
    <rect x="0" y="0" width="285" height="480" fill="#000000" stroke="#000000" stroke-width="2" rx="4"/>
    <rect x="0" y="0" width="285" height="45" fill="#333333"/>
    <text x="16" y="28" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">6. POST-TEST RESULT</text>

    <text x="20" y="90" font-size="14" font-weight="700" fill="#aaaaaa">MEASURED GAIN</text>
    
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="245" height="120" fill="#ffffff" rx="4"/>
      <text x="122" y="55" font-size="34" font-weight="900" fill="#000000" text-anchor="middle">42% → 78%</text>
      <line x1="20" y1="75" x2="225" y2="75" stroke="#e0e0e0" stroke-width="1"/>
      <text x="122" y="102" font-size="20" font-weight="800" fill="#000000" text-anchor="middle">+36 percentage points</text>
    </g>

    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="245" height="180" fill="#1a1a1a" stroke="#444444" stroke-width="1" rx="4"/>
      <text x="122" y="45" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">LEARNING GAP IMPROVED</text>
      <path d="M 122 65 L 122 85 M 116 79 L 122 85 L 128 79" stroke="#ffffff" stroke-width="2" fill="none"/>
      <text x="122" y="115" font-size="13" font-weight="700" fill="#aaaaaa" text-anchor="middle">Student Profile Updated</text>
      <rect x="35" y="135" width="175" height="30" fill="#ffffff" rx="2"/>
      <text x="122" y="155" font-size="12" font-weight="800" fill="#000000" text-anchor="middle">STATUS: CLOSED</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 990)">
    <line x1="0" y1="-30" x2="1760" y2="-30" stroke="#e0e0e0" stroke-width="1"/>
    <text x="0" y="0" font-size="13" font-weight="600" fill="#888888">LEARNEX Closed-Loop Learning Intelligence Platform</text>
    <text x="1760" y="0" font-size="13" font-weight="700" fill="#666666" text-anchor="end">Synthetic Demonstration Data</text>
  </g>
</svg>
